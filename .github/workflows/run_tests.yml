name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # energy-forecast is not checked out in CI, so tools tests that need its
        # data/db skip themselves (see src/config.energy_forecast_available).
        # No ANTHROPIC_API_KEY in CI: tests never make a live API call. The live
        # marker is deselected by pytest.ini, so the guardrails and the eval's
        # scoring logic are checked here for free — the guardrails run against
        # the recorded answers in eval_results.json rather than a fresh model.
        run: pytest tests/ -v
